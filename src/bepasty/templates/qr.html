{% extends '_layout.html' %}
{% import '_utils.html' as utils %}
{% set page_title = '二维码分享' %}

{% block content %}
<section class="qr-panel page-panel">
    <header class="page-heading">
        <h1>二维码分享</h1>
        <p>用另一台设备扫描，直接打开这个文件。</p>
    </header>
    <div id="qr" class="qr-code" role="img" aria-label="文件链接二维码"></div>
    <p id="qr-status" class="text-muted" role="status"></p>
    <noscript><p>二维码需要 JavaScript。你仍可以复制下方链接来分享。</p></noscript>
    {{ utils.share_link(text) }}
    <div class="page-actions">
        <a href="{{ text }}" class="btn btn-primary">返回文件</a>
        <a href="{{ url_for('bepasty.filelist') }}" class="btn btn-outline-secondary">文件列表</a>
    </div>
    <details class="qr-settings">
        <summary>二维码设置</summary>
        <div id="qr-controls" class="management-content" style="display: none">
            <div class="form-group">
                <label for="text">二维码内容</label>
                <input id="text" class="form-control" type="text" value="{{ text }}" autocapitalize="none" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="qrsize">显示大小</label>
                <input id="qrsize" type="range" class="form-control" min="180" max="480" value="280">
            </div>
            <div class="form-group">
                <label for="errorCorrectionLevel">容错级别</label>
                <select id="errorCorrectionLevel" class="form-control">
                    <option value="L">较低（7%）</option>
                    <option value="M">普通（15%）</option>
                    <option value="Q">较高（25%）</option>
                    <option value="H" selected>最高（30%）</option>
                </select>
            </div>
            <button id="qr-update" type="button" class="btn btn-outline-secondary">更新二维码</button>
        </div>
    </details>
</section>
{% endblock %}

{% block extra_script %}
<script src="{{ url_for('static', filename='app/js/qrcode.js', v='20261013-viewbox') }}" type="text/javascript"></script>
<script src="{{ url_for('static', filename='app/js/share.js') }}" type="text/javascript"></script>
<script>
(function () {
    'use strict';
    function create_qrcode(text, level) {
        for (var typeNumber = 1; typeNumber <= 40; typeNumber++) {
            try {
                var qr = qrcode(typeNumber, level);
                qr.addData(text);
                qr.make();
                return qr.createSvgTag();
            } catch (error) {
                if (!error.message || error.message.indexOf('code length overflow') !== 0) {
                    throw error;
                }
            }
        }
        throw new Error('内容过长，无法生成二维码。');
    }
    function update() {
        var target = document.getElementById('qr');
        var status = document.getElementById('qr-status');
        try {
            target.innerHTML = create_qrcode(document.getElementById('text').value,
                document.getElementById('errorCorrectionLevel').value);
            var svg = target.getElementsByTagName('svg')[0];
            var size = document.getElementById('qrsize').value;
            svg.setAttribute('viewBox', '0 0 ' + parseInt(svg.getAttribute('width'), 10) +
                ' ' + parseInt(svg.getAttribute('height'), 10));
            svg.setAttribute('role', 'presentation');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            status.textContent = '';
        } catch (error) {
            target.innerHTML = '';
            status.textContent = '无法生成二维码，请复制分享链接。';
        }
    }
    function loaded() {
        document.getElementById('qr-controls').style.display = 'block';
        document.getElementById('qr-update').addEventListener('click', update, false);
        document.getElementById('qrsize').addEventListener('input', update, false);
        document.getElementById('errorCorrectionLevel').addEventListener('change', update, false);
        update();
    }
    window.addEventListener('load', loaded, false);
}());
</script>
{% endblock %}
