{% extends '_layout.html' %}
{% set page_title = '打开链接' %}

{% block extra_link %}
<meta http-equiv="refresh" content="{{ delay }}; url={{ url }}">
{% endblock %}

{% block content %}
<section class="page-panel redirect-panel">
    <header class="page-heading">
        <h1>即将打开链接</h1>
        <p>将在 {{ delay }} 秒后跳转，也可以直接点击下方按钮。</p>
    </header>
    <p class="redirect-target">{{ url }}</p>
    <div class="page-actions">
        <a href="{{ url }}" class="btn btn-primary">打开链接</a>
        <a href="{{ url_for('bepasty.filelist') }}" class="btn btn-outline-secondary">返回文件列表</a>
    </div>
    <p class="text-muted">此链接会打开外部网站。</p>
</section>
{% endblock %}
