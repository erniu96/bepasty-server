<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ url_for('static', filename='app/favicon.ico') }}" type="image/x-icon">
    <title>{% if page_title %}{{ page_title }} · {% endif %}Bepasty</title>
    <link rel="stylesheet" href="{{ url_for('bepasty.xstatic', name='bootstrap', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('bepasty.xstatic', name='jquery_ui', filename='themes/smoothness/jquery-ui.css') }}">
    <link rel="stylesheet" href="{{ url_for('bepasty.xstatic', name='font_awesome', filename='css/fontawesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('bepasty.xstatic', name='font_awesome', filename='css/solid.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('bepasty.xstatic', name='font_awesome', filename='css/regular.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app/css/style.css', v='20261022-hig') }}">
    {% block extra_link %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">跳到内容</a>
    <div id="wrapper">
        <header id="header" class="site-header">
            <div class="container header-inner">
                <a class="site-brand" href="{{ url_for('bepasty.index') }}">bepasty</a>
                <nav class="primary-nav" aria-label="主导航">
                    {% if may(CREATE) %}
                    <a data-workspace-page="upload" class="btn {% if request.endpoint == 'bepasty.index' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{{ url_for('bepasty.index') }}"{% if request.endpoint == 'bepasty.index' %} aria-current="page"{% endif %}>上传</a>
                    {% endif %}
                    {% if may(LIST) %}
                    <a data-workspace-page="list" class="btn {% if request.endpoint == 'bepasty.filelist' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{{ url_for('bepasty.filelist') }}"{% if request.endpoint == 'bepasty.filelist' %} aria-current="page"{% endif %}>列表</a>
                    {% endif %}
                </nav>
                {% if not config.PASSWORDLESS %}
                {% if flaskg.logged_in %}
                <form method="post" action="{{ url_for('bepasty.logout') }}">
                    <button type="submit" class="btn btn-outline-secondary">退出登录</button>
                </form>
                {% else %}
                <form method="post" action="{{ url_for('bepasty.login') }}" class="form-inline">
                    <label class="sr-only" for="login-token">访问密码</label>
                    <input id="login-token" class="form-control" type="password" name="token" autocomplete="current-password" required placeholder="访问密码">
                    <button type="submit" class="btn btn-outline-secondary">登录</button>
                </form>
                {% endif %}
                {% endif %}
            </div>
        </header>
        <main id="main-content" class="container" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('bepasty.xstatic', name='jquery', filename='jquery.min.js') }}"></script>
    <script src="{{ url_for('bepasty.xstatic', name='jquery_ui', filename='jquery-ui.min.js') }}"></script>
    <script src="{{ url_for('bepasty.xstatic', name='bootstrap', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app/js/copy.js') }}"></script>
    <script src="{{ url_for('static', filename='app/js/list-expiry.js') }}"></script>
    {% block extra_script %}{% endblock %}
</body>
</html>
